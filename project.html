<script>
// re-observe gallery figures created dynamically
const io2 = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io2.unobserve(e.target); } });
}, { threshold: 0.1 });
document.querySelectorAll('#gallery figure').forEach(el => io2.observe(el));
</script>
